<div class="vista-raza-canino" *ngIf="razaCaninoData as razaCanino">
  <div class="perfil-cabecera">
    <div class="avatar"><svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="5.5" cy="10" r="2"/><circle cx="9.5" cy="5.5" r="2"/><circle cx="14.5" cy="5.5" r="2"/><circle cx="18.5" cy="10" r="2"/><path d="M12 12c-3 0-6 3.5-6 6.5 0 1.7 1.3 2.5 3 2.5 1.2 0 2-.6 3-.6s1.8.6 3 .6c1.7 0 3-.8 3-2.5 0-3-3-6.5-6-6.5z"/></svg></div>
    <div><h3 class="perfil-nombre">{{ razaCanino.nombreRazaCanino }}</h3><p class="perfil-tipo">Raza de canino</p></div>
  </div>
  <div class="datos-grid">
    <div class="dato-grupo"><span class="dato-label">Número de registro</span><span class="dato-valor">{{ razaCanino.idRazaCanino }}</span></div>
    <div class="dato-grupo"><span class="dato-label">Nombre</span><span class="dato-valor">{{ razaCanino.nombreRazaCanino }}</span></div>
  </div>
  <div class="vista-acciones"><button type="button" class="btn-titulo-sistema btn-secundario" (click)="closeModal()">Cerrar</button></div>
</div>
