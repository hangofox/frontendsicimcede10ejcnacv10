<form [formGroup]="form" (ngSubmit)="enviar()"><div class="form-seccion"><div class="seccion-titulo">Datos del historial</div><div class="form-grid"><label class="form-group">Número de registro<input formControlName="registro"></label><label class="form-group">Unidad militar<input formControlName="unidad"></label><label class="form-group">Tipo de documento<input formControlName="tipo"></label><label class="form-group">Documento<input formControlName="documento"></label><label class="form-group">Lugar expedición<input formControlName="expedicion"></label><label class="form-group">Nombres<input formControlName="nombres"></label><label class="form-group">Primer apellido<input formControlName="apellido1"></label><label class="form-group">Segundo apellido<input formControlName="apellido2"></label><label class="form-group">Dirección<input formControlName="direccion"></label><label class="form-group">Teléfono<input formControlName="telefono"></label><label class="form-group">Móvil<input formControlName="movil"></label><label class="form-group">Correo personal<input formControlName="correo1"></label><label class="form-group">Correo institucional<input formControlName="correo2"></label><label class="form-group">País<input formControlName="pais"></label><label class="form-group">Departamento<input formControlName="departamento"></label><label class="form-group">Ciudad<input formControlName="ciudad"></label></div></div><div class="form-acciones"><button type="button" (click)="cerrarModal.emit()">Cancelar</button>@if(modo==='eliminar'){<button type="button" (click)="confirmar()">Eliminar</button>}@else{<button [disabled]="form.invalid">{{modo==='modificar'?'Modificar':'Guardar'}}</button>}</div></form>
