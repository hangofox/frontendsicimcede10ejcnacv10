<div class="modal-formulario" *ngIf="infraestructurasForm">

  <div class="alerta-eliminar" *ngIf="banderaCrudEliminar">
    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
    Esta acción eliminará el registro de la infraestructura de la lista simulada. ¿Desea continuar?
  </div>

  <form [formGroup]="infraestructurasForm" (ngSubmit)="guardarModificar()">

    <div class="form-seccion">
      <div class="seccion-titulo">Identificación</div>
      <div class="form-grid">
        <div class="form-group">
          <label>Denominación (*)</label>
          <input type="text" formControlName="denominacionInfraestructura" placeholder="Ej. EDIFICIO COMANDO BRIGADA">
        </div>
        <div class="form-group">
          <label>N.° Inventario (*)</label>
          <input type="text" formControlName="numeroInventarioInfraestructura" placeholder="Ej. INV-0001">
        </div>
        <div class="form-group">
          <label>N.° Activo fijo (*)</label>
          <input type="text" formControlName="numeroActivoFijoInfraestructura" placeholder="Ej. AF-0001">
        </div>
        <div class="form-group">
          <label>Unidad militar (*)</label>
          <select formControlName="unidadMilitarSeleccionada">
            <option value="">-- Seleccione --</option>
            <option *ngFor="let unidadMilitar of unidadesMilitares" [value]="unidadMilitar.idUnidadMilitar">
              {{ unidadMilitar.nombreUnidadMilitar }} ({{ unidadMilitar.siglaoAcronimoUnidadMilitar }})
            </option>
          </select>
        </div>
        <div class="form-group">
          <label>Centro de costo unidad militar (*)</label>
          <input type="text" formControlName="centroCostoUnidadMilitarInfraestructura" placeholder="Ej. CC-001">
        </div>
        <div class="form-group">
          <label>Estado de uso (*)</label>
          <select formControlName="estadoUsoInfraestructura">
            <option value="">-- Seleccione --</option>
            <option value="BUENO">BUENO</option>
            <option value="REGULAR">REGULAR</option>
            <option value="MALO">MALO</option>
            <option value="MANTENIMIENTO">MANTENIMIENTO</option>
            <option value="FUERA DE SERVICIO">FUERA DE SERVICIO</option>
            <option value="DADA DE BAJA">DADA DE BAJA</option>
          </select>
        </div>
        <div class="form-group">
          <label>Sociedad de unidad centralizadora (*)</label>
          <select formControlName="sociedadUnidadCentralizadoraSeleccionada">
            <option value="">-- Seleccione --</option>
            <option *ngFor="let sociedadUnidadCentralizadora of sociedadesUnidadesCentralizadoras" [value]="sociedadUnidadCentralizadora.idSociedadUnidadCentralizadora">
              {{ sociedadUnidadCentralizadora.codigoSociedadUnidadCentralizadora }} ({{ sociedadUnidadCentralizadora.unidadMilitarDTO.siglaoAcronimoUnidadMilitar }})
            </option>
          </select>
        </div>
        <div class="form-group">
          <label>Tipo de estructura (*)</label>
          <select formControlName="tipoEstructuraInfraestructuraSeleccionada">
            <option value="">-- Seleccione --</option>
            <option *ngFor="let tipoEstructuraInfraestructura of tiposEstructurasInfraestructuras" [value]="tipoEstructuraInfraestructura.idTipoEstructuraInfraestructura">
              {{ tipoEstructuraInfraestructura.nombreTipoEstructuraInfraestructura }}
            </option>
          </select>
        </div>
        <div class="form-group">
          <label>Funcionalidad (*)</label>
          <select formControlName="funcionalidadInfraestructuraSeleccionada">
            <option value="">-- Seleccione --</option>
            <option *ngFor="let funcionalidadInfraestructura of funcionalidadesInfraestructuras" [value]="funcionalidadInfraestructura.idFuncionalidadInfraestructura">
              {{ funcionalidadInfraestructura.nombreFuncionalidadInfraestructura }}
            </option>
          </select>
        </div>
        <div class="form-group">
          <label>Seguro (*)</label>
          <select formControlName="seguroSeleccionado">
            <option value="">-- Seleccione --</option>
            <option *ngFor="let seguro of seguros" [value]="seguro.idSeguro">
              {{ seguro.aseguradoraDTO.nombreAseguradora }} — {{ seguro.tipoSeguroDTO.nombreTipoSeguro }}
            </option>
          </select>
        </div>
        <div class="form-group">
          <label>Terreno (*)</label>
          <select formControlName="terrenoSeleccionado">
            <option value="">-- Seleccione --</option>
            <option *ngFor="let terreno of terrenos" [value]="terreno.idTerreno">
              {{ terreno.denominacionTerreno }} ({{ terreno.numeroInventarioTerreno }})
            </option>
          </select>
        </div>
      </div>
    </div>

    <div class="form-seccion">
      <div class="seccion-titulo">Ubicación</div>
      <div class="form-grid">
        <div class="form-group">
          <label>País de origen (*)</label>
          <input type="text" formControlName="paisOrigenInfraestructura" placeholder="Ej. COLOMBIA">
        </div>
        <div class="form-group">
          <label>Departamento o estado (*)</label>
          <input type="text" formControlName="departamentoOEstadoOrigenInfraestructura" placeholder="Ej. CUNDINAMARCA">
        </div>
        <div class="form-group">
          <label>Ciudad de origen (*)</label>
          <input type="text" formControlName="ciudadOrigenInfraestructura" placeholder="Ej. BOGOTÁ D.C.">
        </div>
        <div class="form-group form-group-ancho">
          <label>Dirección (*)</label>
          <input type="text" formControlName="direccionInfraestructura" placeholder="Ej. Cra 10 # 20-30">
        </div>
        <div class="form-group">
          <label>Latitud</label>
          <input type="text" formControlName="latitudInfraestructura" placeholder="Ej. 4.710989">
        </div>
        <div class="form-group">
          <label>Longitud</label>
          <input type="text" formControlName="longitudInfraestructura" placeholder="Ej. -74.072092">
        </div>
      </div>
    </div>

    <div class="form-seccion">
      <div class="seccion-titulo">Dimensiones</div>
      <div class="form-grid">
        <div class="form-group">
          <label>Largo</label>
          <input type="text" formControlName="numeroLargoInfraestructura" placeholder="Ej. 40">
        </div>
        <div class="form-group">
          <label>Unidad de medida (largo)</label>
          <input type="text" formControlName="nombreUnidadMedidaLargoInfraestructura" placeholder="Ej. METROS">
        </div>
        <div class="form-group">
          <label>Anchura</label>
          <input type="text" formControlName="numeroAnchuraInfraestructura" placeholder="Ej. 25">
        </div>
        <div class="form-group">
          <label>Unidad de medida (anchura)</label>
          <input type="text" formControlName="nombreUnidadMedidaAnchuraInfraestructura" placeholder="Ej. METROS">
        </div>
        <div class="form-group">
          <label>Profundidad</label>
          <input type="text" formControlName="numeroProfundidadInfraestructura" placeholder="Ej. 15">
        </div>
        <div class="form-group">
          <label>Unidad de medida (profundidad)</label>
          <input type="text" formControlName="nombreUnidadMedidaProfundidadInfraestructura" placeholder="Ej. METROS">
        </div>
        <div class="form-group">
          <label>N.° de pisos</label>
          <input type="text" formControlName="numeroPisosInfraestructura" placeholder="Ej. 3">
        </div>
      </div>
    </div>

    <div class="form-seccion">
      <div class="seccion-titulo">Datos técnicos y legales</div>
      <div class="form-grid">
        <div class="form-group">
          <label>Norma sismorresistente</label>
          <input type="text" formControlName="normaSismoresistenteInfraestructura" placeholder="Ej. NSR-10">
        </div>
        <div class="form-group">
          <label>Propiedad horizontal</label>
          <select formControlName="propiedadHorizontalInfraestructura">
            <option value="">-- Seleccione --</option>
            <option value="SI">SI</option>
            <option value="NO">NO</option>
          </select>
        </div>
        <div class="form-group">
          <label>Estrato</label>
          <input type="text" formControlName="estratoInfraestructura" placeholder="Ej. 4">
        </div>
        <div class="form-group form-group-ancho">
          <label>Denominación posterior</label>
          <input type="text" formControlName="denominacionPosteriorInfraestructura" placeholder="Ej. NUEVA DENOMINACIÓN">
        </div>
      </div>
    </div>

    <div class="form-seccion">
      <div class="seccion-titulo">Datos contables</div>
      <div class="form-grid">
        <div class="form-group">
          <label>N.° de cuenta</label>
          <input type="text" formControlName="numeroCuentaInfraestructura" placeholder="Ej. 1605">
        </div>
        <div class="form-group">
          <label>N.° de subcuenta</label>
          <input type="text" formControlName="numeroSubcuentaInfraestructura" placeholder="Ej. 160501">
        </div>
        <div class="form-group">
          <label>Valor contable</label>
          <input type="text" formControlName="valorContableInfraestructura" placeholder="Ej. 850000000">
        </div>
        <div class="form-group">
          <label>Fecha de alta</label>
          <input type="datetime-local" formControlName="fechaHMSAltaInfraestructura">
        </div>
        <div class="form-group">
          <label>Fecha de amortización</label>
          <input type="datetime-local" formControlName="fechaHMSAmortizacionInfraestructura">
        </div>
        <div class="form-group">
          <label>Fecha de ingreso</label>
          <input type="datetime-local" formControlName="fechaHMSIngresoInfraestructura">
        </div>
        <div class="form-group">
          <label>Fecha de modificación</label>
          <input type="datetime-local" formControlName="fechaHMSModificacionInfraestructura">
        </div>
      </div>
    </div>

    <div class="form-acciones">
      <button type="button" class="btn-sicim btn-secundario" (click)="closeModal()">Cancelar</button>
      <button type="submit" class="btn-sicim btn-primario" *ngIf="banderaCrudGuardar || banderaCrudModificar" [disabled]="infraestructurasForm.invalid">
        {{ banderaCrudGuardar ? 'Guardar' : 'Modificar' }}
      </button>
      <button type="button" class="btn-sicim btn-peligro" *ngIf="banderaCrudEliminar" (click)="confirmarEliminar()">Eliminar</button>
    </div>

  </form>
</div>
