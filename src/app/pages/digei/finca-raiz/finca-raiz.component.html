<section class="finca-raiz" aria-label="Finca Raíz">
  <div class="finca-raiz__cuerpo">
    <div class="fr-escena">
      <div class="fr-engranajes">
        <div class="fr-pinon fr-pinon--digei">
          <div class="fr-pinon__rotor" aria-hidden="true">
            <span class="fr-pinon__anillo"></span>
          </div>
          <a
            class="fr-pinon__medallon fr-pinon__medallon--enlace"
            routerLink="/digei"
            aria-label="Ir al módulo DIGEI"
          >
            <span class="fr-pinon__medallon-img" aria-hidden="true"></span>
          </a>
        </div>

        <div class="fr-pinon fr-pinon--finca">
          <div class="fr-pinon__rotor" aria-hidden="true">
            <span class="fr-pinon__anillo"></span>
          </div>
          <span class="fr-pinon__medallon" role="img" aria-label="Finca Raíz">
            <span class="fr-pinon__medallon-img" aria-hidden="true"></span>
          </span>
        </div>
      </div>
    </div>

    <!-- Panal simetrico 2-1-2, con la misma geometria de geomatica-topografia. -->
    <!-- Panal 2-1-2, mismo reparto que geomatica-topografia. Terrenos e
         Infraestructuras navegan; las otras tres se realzan al pasar el
         cursor pero todavia no llevan a ningun sitio. -->
    <div class="fr-panal">
      <article class="fr-ranura fr-ranura--terrenos">
        <a class="fr-ranura__pieza fr-ranura__pieza--enlace"
           routerLink="/digei/finca-raiz/terrenos/listado-terrenos"
           aria-label="Terrenos"></a>
      </article>

      <article class="fr-ranura fr-ranura--infraestructura">
        <a class="fr-ranura__pieza fr-ranura__pieza--enlace"
           routerLink="/digei/finca-raiz/infraestructuras/listado-infraestructuras"
           aria-label="Infraestructuras"></a>
      </article>

      <article class="fr-ranura fr-ranura--arrendadas">
        <a class="fr-ranura__pieza fr-ranura__pieza--enlace"
           routerLink="/digei/finca-raiz/infraestructuras-arrendadas/listado-infraestructuras-arrendadas"
           aria-label="Infraestructuras arrendadas"></a>
      </article>

      <article class="fr-ranura fr-ranura--comodatos">
        <a class="fr-ranura__pieza fr-ranura__pieza--enlace"
           routerLink="/digei/finca-raiz/comodatos/listado-comodatos"
           aria-label="Comodatos"></a>
      </article>

      <article class="fr-ranura fr-ranura--dashboards">
        <a class="fr-ranura__pieza fr-ranura__pieza--enlace"
           routerLink="/digei/finca-raiz/deshboards-estadisticas"
           aria-label="Ir a dashboards y estadísticas"></a>
      </article>
    </div>
  </div>
</section>
