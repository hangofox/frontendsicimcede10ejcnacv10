<form [formGroup]="terrenoForm" (ngSubmit)="enviar()">
  @if (modo === 'eliminar') { <p class="alerta-eliminar">Esta acción eliminará definitivamente el terreno.</p> }
  <section class="form-seccion"><h4 class="seccion-titulo">Identificación y clasificación</h4><div class="form-grid">
    <label class="form-group">Unidad militar<select formControlName="unidad"><option value="">Seleccione</option>@for (u of unidadesMilitares; track u.idUnidadMilitar) { <option [value]="u.idUnidadMilitar">{{ u.siglaoAcronimoUnidadMilitar }} - {{ u.nombreUnidadMilitar }}</option> }</select></label>
    <label class="form-group">Sociedad centralizadora<select formControlName="sociedad"><option value="">Seleccione</option>@for (s of sociedades; track s.idSociedadUnidadCentralizadora) { <option [value]="s.idSociedadUnidadCentralizadora">{{ s.codigoSociedadUnidadCentralizadora }}</option> }</select></label>
    <label class="form-group">Estado<select formControlName="estado"><option value="">Seleccione</option>@for (e of estados; track e.idEstadoTerreno) { <option [value]="e.idEstadoTerreno">{{ e.nombreEstadoTerreno }}</option> }</select></label>
    <label class="form-group">Denominación<input formControlName="denominacionTerreno"></label><label class="form-group">Inventario<input formControlName="numeroInventarioTerreno"></label><label class="form-group">Activo fijo<input formControlName="numeroActivoFijoTerreno"></label>
  </div></section>
  <section class="form-seccion"><h4 class="seccion-titulo">Información jurídica y ubicación</h4><div class="form-grid">
    <label class="form-group">Número catastral<input formControlName="numeroCatastralTerreno"></label><label class="form-group">Escritura<input formControlName="numeroEscrituraTerreno"></label><label class="form-group">Notaría<input formControlName="numeroNotariaTerreno"></label><label class="form-group">Lugar de notaría<input formControlName="lugarUbicacionNotariaTerreno"></label><label class="form-group">Fecha matrícula<input type="datetime-local" formControlName="fechaHMSMatriculaTerreno"></label>
    <label class="form-group">País<input formControlName="paisOrigenTerreno"></label><label class="form-group">Departamento/Estado<input formControlName="departamentoOEstadoOrigenTerreno"></label><label class="form-group">Ciudad<input formControlName="ciudadOrigenTerreno"></label><label class="form-group form-group-ancho">Dirección<input formControlName="direccionTerreno"></label><label class="form-group">Latitud<input formControlName="latitudTerreno"></label><label class="form-group">Longitud<input formControlName="longitudTerreno"></label>
  </div></section>
  <section class="form-seccion"><h4 class="seccion-titulo">Área e impuesto predial</h4><div class="form-grid">
    <label class="form-group">Área<input formControlName="numeroAreaTerreno"></label><label class="form-group">Unidad de medida<input formControlName="nombreUnidadMedidaTerreno"></label><label class="form-group">Exonerado<select formControlName="siONoExoneradoImpuestoPredialTerreno"><option>NO</option><option>SI</option></select></label><label class="form-group">Años de exoneración<input type="number" min="0" formControlName="numeroAnosExoneracionImpuestoPredialTerreno"></label><label class="form-group">Fecha de alta<input type="datetime-local" formControlName="fechaHMSAltaTerreno"></label><label class="form-group">Fecha de ingreso<input type="datetime-local" formControlName="fechaHMSIngresoTerreno"></label><label class="form-group form-group-ancho">Observaciones<textarea rows="3" formControlName="observacionesTerreno"></textarea></label>
  </div></section>
  <div class="form-acciones"><button type="button" class="btn-sicim btn-secundario" (click)="cerrarModal.emit()">Cancelar</button>@if (modo === 'eliminar') { <button type="button" class="btn-sicim btn-peligro" (click)="confirmarEliminar()">Eliminar</button> } @else { <button type="submit" class="btn-sicim btn-primario">Guardar</button> }</div>
</form>
