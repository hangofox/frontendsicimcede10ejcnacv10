<h2 class="page-title">DASHBOARDS Y ESTADÍSTICAS</h2>

<section class="estadisticas-card" [formGroup]="filtrosForm" aria-label="Dashboards y estadísticas de Finca Raíz">
  <div class="filtros">
    <select formControlName="tipo" (change)="cambiarTipo()" aria-label="Tipo de información">
      <option value="TERRENOS">TERRENOS</option>
      <option value="INFRAESTRUCTURAS">INFRAESTRUCTURAS</option>
      <option value="INFRAESTRUCTURAS ARRENDADAS">INFRAESTRUCTURAS ARRENDADAS</option>
      <option value="COMODATOS">COMODATOS</option>
    </select>

    <input formControlName="keyword" type="search" [placeholder]="'Buscar en ' + tituloSeleccionado.toLowerCase()" (keyup.enter)="cargarEstadisticas()">

    @if (tipoSeleccionado === 'COMODATOS') {
      <select formControlName="terreno" (change)="cargarEstadisticas()" aria-label="Filtrar por terreno">
        <option value="">TODOS LOS TERRENOS</option>
        @for (terreno of terrenos; track terreno.idTerreno) {
          <option [value]="terreno.idTerreno">{{ terreno.denominacionTerreno }}</option>
        }
      </select>
    } @else {
      <select formControlName="unidad" (change)="cargarEstadisticas()" aria-label="Filtrar por unidad militar">
        <option value="">TODAS LAS UNIDADES MILITARES</option>
        @for (unidad of unidadesMilitares; track unidad.idUnidadMilitar) {
          <option [value]="unidad.siglaoAcronimoUnidadMilitar">{{ unidad.siglaoAcronimoUnidadMilitar }} - {{ unidad.nombreUnidadMilitar }}</option>
        }
      </select>
    }

    <button type="button" class="btn-filtrar" (click)="cargarEstadisticas()">Actualizar</button>
    <button type="button" class="btn-limpiar" (click)="limpiarFiltros()">Limpiar</button>
  </div>

  <app-semaforo-contadores [total]="totalRegistros" [estados]="estadosContadores" />

  @if (mensajeError) { <p class="mensaje-error" role="alert">{{ mensajeError }}</p> }
  @if (cargando) { <p class="mensaje-carga">Actualizando estadísticas...</p> }

  <div class="graficas" [class.graficas--cargando]="cargando">
    <article class="grafica-card"><div class="grafica-contenedor"><canvas #graficaTorta></canvas></div></article>
    <article class="grafica-card"><div class="grafica-contenedor"><canvas #graficaBarras></canvas></div></article>
  </div>
</section>
