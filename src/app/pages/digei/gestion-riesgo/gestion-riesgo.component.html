<section class="gestion-riesgo" aria-label="Gestión del Riesgo">
  <div class="gestion-riesgo__cuerpo">
    <div class="gr-escena">
      <div class="gr-engranajes">
        <div class="gr-pinon gr-pinon--digei">
          <div class="gr-pinon__rotor" aria-hidden="true">
            <span class="gr-pinon__anillo"></span>
            <!-- Copia de la parte interior del mismo PNG, recentrada sobre los dientes. -->
            <span class="gr-pinon__anillo gr-pinon__anillo--interior"></span>
          </div>
          <a
            class="gr-pinon__medallon gr-pinon__medallon--enlace"
            routerLink="/digei"
            aria-label="Ir al módulo DIGEI"
          >
            <span class="gr-pinon__medallon-img" aria-hidden="true"></span>
          </a>
        </div>

        <div class="gr-pinon gr-pinon--gestion-riesgo">
          <div class="gr-pinon__rotor" aria-hidden="true">
            <span class="gr-pinon__anillo"></span>
            <!-- Copia interior del mismo PNG, recentrada sobre los dientes. -->
            <span class="gr-pinon__anillo gr-pinon__anillo--interior"></span>
          </div>
          <span class="gr-pinon__medallon" role="img" aria-label="Gestión del Riesgo">
            <span class="gr-pinon__medallon-img" aria-hidden="true"></span>
          </span>
        </div>
      </div>
    </div>

    <!-- Panal 3-3-2 segun la referencia imagen_objetivo_futurista_gestion_riesgo_01:
         cada fila va corrida medio hexagono a la derecha de la anterior. Las
         ocho piezas se realzan al pasar el cursor; los informes de apoyos en
         atencion y prevencion navegan y las demas todavia no llevan a ningun
         sitio: se enlazaran cuando se definan sus componentes. -->
    <div class="gr-panal">
      <article class="gr-ranura gr-ranura--informes-apoyos-atenc-prev-emerg-desast">
        <a class="gr-ranura__pieza gr-ranura__pieza--enlace"
           routerLink="/digei/gestion-riesgo/apoyos-atenc-prev-emerg-desast/listado-apoyos-atenc-prev-emerg-desast"
           aria-label="Informes de los apoyos en atención y prevención de emergencias y/o desastres"></a>
      </article>

      <article class="gr-ranura gr-ranura--informes-apoyos-obr-red-mitig-gest-riesg-desast">
        <span class="gr-ranura__pieza" role="img" aria-label="Informes de apoyo a obras de reducción y mitigación por gestión del riesgo de desastres"></span>
      </article>

      <article class="gr-ranura gr-ranura--lineamientos">
        <span class="gr-ranura__pieza" role="img" aria-label="Lineamientos de gestión del riesgo"></span>
      </article>

      <article class="gr-ranura gr-ranura--solicitudes">
        <span class="gr-ranura__pieza" role="img" aria-label="Solicitudes de gestión del riesgo"></span>
      </article>

      <article class="gr-ranura gr-ranura--avales">
        <span class="gr-ranura__pieza" role="img" aria-label="Avales de gestión del riesgo"></span>
      </article>

      <article class="gr-ranura gr-ranura--planes-programas">
        <span class="gr-ranura__pieza" role="img" aria-label="Planes y programas de gestión del riesgo"></span>
      </article>

      <article class="gr-ranura gr-ranura--estadisticas">
        <span class="gr-ranura__pieza" role="img" aria-label="Estadísticas de gestión del riesgo"></span>
      </article>

      <article class="gr-ranura gr-ranura--dashboard">
        <span class="gr-ranura__pieza" role="img" aria-label="Dashboard de gestión del riesgo"></span>
      </article>
    </div>
  </div>
</section>
