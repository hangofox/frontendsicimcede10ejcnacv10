<div class="modal-formulario">
  @if (modo === 'eliminar') {
    <div class="alerta-eliminar">Esta acción eliminará el registro del historial de equipos de transporte del apoyo. ¿Desea continuar?</div>
  }

  <form [formGroup]="form" (ngSubmit)="enviar()">
    <div class="form-seccion">
      <div class="seccion-titulo">Datos del equipo de transporte del apoyo</div>
      <div class="form-grid">
        <div class="form-group"><label>Número de registro</label><input formControlName="registro" placeholder="Asignado automáticamente"></div>
        <div class="form-group">
          <label>Equipo de ingenieros (*)</label>
          <select formControlName="equipoIngenieroSeleccionado" (change)="onCambioEquipoIngeniero()">
            <option value="">-- Seleccione --</option>
            @for (equipo of equiposIngenieros; track equipo.idEquipoIngeniero) {
              <option [value]="equipo.idEquipoIngeniero">{{ equipo.denominacionEquipoIngeniero }} ({{ equipo.numeroInventarioEquipoIngeniero }})</option>
            }
          </select>
        </div>
        <div class="form-group"><label>Clasificación</label><input formControlName="clasificacion" placeholder="Se toma del equipo seleccionado"></div>
        <div class="form-group"><label>Subclasificación</label><input formControlName="subclasificacion" placeholder="Se toma del equipo seleccionado"></div>
        <div class="form-group"><label>Elemento de la subclasificación</label><input formControlName="elemento" placeholder="Se toma del equipo seleccionado"></div>
        <div class="form-group"><label>Placa del equipo de transporte (*)</label><input formControlName="placa" placeholder="Ej. EJC-EI-001"></div>
        <div class="form-group"><label>Días empleados (*)</label><input type="number" min="0" formControlName="dias" placeholder="Ej. 3"></div>
      </div>
    </div>

    <div class="form-acciones">
      <button type="button" class="btn-titulo-sistema btn-secundario" (click)="cerrarModal.emit()">Cancelar</button>
      @if (modo === 'eliminar') {
        <button type="button" class="btn-titulo-sistema btn-peligro" (click)="confirmar()">Eliminar</button>
      } @else {
        <button type="submit" class="btn-titulo-sistema btn-primario" [disabled]="form.invalid">{{ modo === 'modificar' ? 'Modificar' : 'Guardar' }}</button>
      }
    </div>
  </form>
</div>
