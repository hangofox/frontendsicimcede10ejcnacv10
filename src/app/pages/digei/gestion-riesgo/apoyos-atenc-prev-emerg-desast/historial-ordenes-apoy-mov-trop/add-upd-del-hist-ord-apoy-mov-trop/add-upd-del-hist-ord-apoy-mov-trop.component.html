<div class="modal-formulario">
  @if (modo === 'eliminar') {
    <div class="alerta-eliminar">Esta acción eliminará el registro del historial de órdenes de apoyos de movimientos de tropas del apoyo. ¿Desea continuar?</div>
  }

  <form [formGroup]="form" (ngSubmit)="enviar()">
    <div class="form-seccion">
      <div class="seccion-titulo">Datos de la orden de apoyo de movimiento de tropas</div>
      <div class="form-grid">
        <div class="form-group"><label>Número de registro</label><input formControlName="registro" placeholder="Asignado automáticamente"></div>
        <div class="form-group"><label>Número de oficio / HR (*)</label><input formControlName="oficio" placeholder="Ej. OFICIO-HR-001-2026"></div>
        <div class="form-group form-group-ancho">
          <label>Asunto (*)</label>
          <textarea formControlName="asunto" rows="4" placeholder="Ej. Orden de apoyo para movimiento de tropas en atención de emergencia por inundación..."></textarea>
        </div>
      </div>
    </div>

    <div class="form-acciones">
      <button type="button" class="btn-titulo-sistema btn-secundario" (click)="cerrarModal.emit()">Cancelar</button>
      @if (modo === 'eliminar') {
        <button type="button" class="btn-titulo-sistema btn-peligro" (click)="confirmar()">Eliminar</button>
      } @else {
        <button type="submit" class="btn-titulo-sistema btn-primario" [disabled]="form.invalid">{{ modo === 'modificar' ? 'Modificar' : 'Guardar' }}</button>
      }
    </div>
  </form>
</div>
