<div class="modal-formulario">
  @if (modo === 'eliminar') {
    <div class="alerta-eliminar">Esta acción eliminará el registro del historial de controles de avances de la obra del apoyo. ¿Desea continuar?</div>
  }

  <form [formGroup]="form" (ngSubmit)="enviar()">
    <div class="form-seccion">
      <div class="seccion-titulo">Datos del control de avance de la obra</div>
      <div class="form-grid">
        <div class="form-group"><label>Número de registro</label><input formControlName="registro" placeholder="Asignado automáticamente"></div>
        <div class="form-group"><label>Nombre del control de avance (*)</label><input type="text" maxlength="255" formControlName="nombre" placeholder="Ej. CONTROL DE AVANCE DE CONSTRUCCION DE MURO DE CONTENCION"></div>
        <div class="form-group"><label>Porcentaje de actividades programadas</label><input type="text" maxlength="150" formControlName="porcentajeProgramado" placeholder="Ej. 100"></div>
        <div class="form-group"><label>Porcentaje de actividades ejecutadas</label><input type="text" maxlength="150" formControlName="porcentajeEjecutado" placeholder="Ej. 80"></div>
        <div class="form-group"><label>Porcentaje de actividades faltantes</label><input type="text" maxlength="150" formControlName="porcentajeFaltante" placeholder="Ej. 20"></div>
        <div class="form-group form-group-ancho"><label>Observaciones</label><textarea formControlName="observaciones" rows="4" placeholder="Ej. Se terminó la cimentación del muro..."></textarea></div>
      </div>
    </div>

    <div class="form-acciones">
      <button type="button" class="btn-titulo-sistema btn-secundario" (click)="cerrarModal.emit()">Cancelar</button>
      @if (modo === 'eliminar') {
        <button type="button" class="btn-titulo-sistema btn-peligro" (click)="confirmar()">Eliminar</button>
      } @else {
        <button type="submit" class="btn-titulo-sistema btn-primario" [disabled]="form.invalid">{{ modo === 'modificar' ? 'Modificar' : 'Guardar' }}</button>
      }
    </div>
  </form>
</div>
