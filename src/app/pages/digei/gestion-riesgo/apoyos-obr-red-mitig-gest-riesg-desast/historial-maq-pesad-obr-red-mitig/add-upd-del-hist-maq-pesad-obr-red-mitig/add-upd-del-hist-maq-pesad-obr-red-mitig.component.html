<div class="modal-formulario">
  @if (modo === 'eliminar') {
    <div class="alerta-eliminar">Esta acción eliminará el registro del historial de maquinarias pesadas del apoyo. ¿Desea continuar?</div>
  }

  <form [formGroup]="form" (ngSubmit)="enviar()">
    <div class="form-seccion">
      <div class="seccion-titulo">Datos de la maquinaria pesada del apoyo</div>
      <div class="form-grid">
        <div class="form-group"><label>Número de registro</label><input formControlName="registro" placeholder="Asignado automáticamente"></div>
        <div class="form-group">
          <label>Maquinaria pesada (*)</label>
          <select formControlName="maquinariaPesadaSeleccionada" (change)="onCambioMaquinariaPesada()">
            <option value="">-- Seleccione --</option>
            @for (maquinaria of maquinariasPesadas; track maquinaria.idMaquinariaPesada) {
              <option [value]="maquinaria.idMaquinariaPesada">{{ maquinaria.nombreMaquinariaPesada }} ({{ maquinaria.empadronamientoMaquinariaPesada }})</option>
            }
          </select>
        </div>
        <div class="form-group"><label>Empadronamiento</label><input formControlName="empadronamiento" placeholder="Se toma de la maquinaria seleccionada"></div>
        <div class="form-group"><label>Total horas empleadas (*)</label><input type="number" min="0" formControlName="horas" placeholder="Ej. 3"></div>
      </div>
    </div>

    <div class="form-acciones">
      <button type="button" class="btn-titulo-sistema btn-secundario" (click)="cerrarModal.emit()">Cancelar</button>
      @if (modo === 'eliminar') {
        <button type="button" class="btn-titulo-sistema btn-peligro" (click)="confirmar()">Eliminar</button>
      } @else {
        <button type="submit" class="btn-titulo-sistema btn-primario" [disabled]="form.invalid">{{ modo === 'modificar' ? 'Modificar' : 'Guardar' }}</button>
      }
    </div>
  </form>
</div>
