<section class="gestion-ambiental" aria-label="Gestión Ambiental">
  <div class="gestion-ambiental__cuerpo">
    <div class="ga-escena">
      <div class="ga-engranajes">
        <div class="ga-pinon ga-pinon--digei">
          <div class="ga-pinon__rotor" aria-hidden="true">
            <span class="ga-pinon__anillo"></span>
            <!-- Copia de la parte interior del mismo PNG, recentrada sobre los dientes. -->
            <span class="ga-pinon__anillo ga-pinon__anillo--interior"></span>
          </div>
          <a
            class="ga-pinon__medallon ga-pinon__medallon--enlace"
            routerLink="/digei"
            aria-label="Ir al módulo DIGEI"
          >
            <span class="ga-pinon__medallon-img" aria-hidden="true"></span>
          </a>
        </div>

        <div class="ga-pinon ga-pinon--gestion-ambiental">
          <div class="ga-pinon__rotor" aria-hidden="true">
            <span class="ga-pinon__anillo"></span>
            <!-- Copia interior del mismo PNG, recentrada sobre los dientes. -->
            <span class="ga-pinon__anillo ga-pinon__anillo--interior"></span>
          </div>
          <span class="ga-pinon__medallon" role="img" aria-label="Gestión Ambiental">
            <span class="ga-pinon__medallon-img" aria-hidden="true"></span>
          </span>
        </div>
      </div>
    </div>

    <!-- Panal 3-3-2 segun la referencia imagen_gestion_ambiental_futurista_01:
         cada fila va corrida medio hexagono a la derecha de la anterior, igual
         que en gestion-riesgo. Las ocho piezas se realzan al pasar el cursor;
         las de solicitudes y avales de obras nuevas de saneamiento basico
         navegan y las demas todavia no llevan a ningun sitio: se enlazaran
         cuando se definan sus componentes. -->
    <div class="ga-panal">
      <article class="ga-ranura ga-ranura--solicitudes-obras-nuevas-saneamientos-basicos">
        <a class="ga-ranura__pieza ga-ranura__pieza--enlace"
           routerLink="/digei/gestion-ambiental/solicitudes-obras-nuevas-san-bas/listado-solicitudes-obras-nuevas-san-bas"
           aria-label="Solicitudes de obras nuevas de saneamiento básico"></a>
      </article>

      <article class="ga-ranura ga-ranura--avales-obras-nuevas-saneamientos-basicos">
        <a class="ga-ranura__pieza ga-ranura__pieza--enlace"
           routerLink="/digei/gestion-ambiental/solicitudes-obras-nuevas-san-bas-av/listado-solicitudes-obras-nuevas-san-bas-av"
           aria-label="Avales de obras nuevas de saneamiento básico"></a>
      </article>

      <article class="ga-ranura ga-ranura--educacion-ambiental">
        <span class="ga-ranura__pieza" role="img" aria-label="Educación ambiental"></span>
      </article>

      <article class="ga-ranura ga-ranura--solicitudes-mantenimientos-saneamientos-basicos">
        <span class="ga-ranura__pieza" role="img" aria-label="Solicitudes de mantenimientos de saneamiento básico"></span>
      </article>

      <article class="ga-ranura ga-ranura--avales-mantenimientos-saneamientos-basicos">
        <span class="ga-ranura__pieza" role="img" aria-label="Avales de mantenimientos de saneamiento básico"></span>
      </article>

      <article class="ga-ranura ga-ranura--tramites-ambientales">
        <span class="ga-ranura__pieza" role="img" aria-label="Trámites ambientales"></span>
      </article>

      <article class="ga-ranura ga-ranura--estadisticas">
        <span class="ga-ranura__pieza" role="img" aria-label="Estadísticas de gestión ambiental"></span>
      </article>

      <article class="ga-ranura ga-ranura--dashboard">
        <span class="ga-ranura__pieza" role="img" aria-label="Dashboard de gestión ambiental"></span>
      </article>
    </div>
  </div>
</section>
