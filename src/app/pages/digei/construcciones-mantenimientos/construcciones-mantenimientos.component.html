<section class="construcciones-mantenimientos" aria-label="Construcciones y Mantenimientos">
  <div class="construcciones-mantenimientos__cuerpo">
    <div class="cm-escena">
      <div class="cm-engranajes">
        <div class="cm-pinon cm-pinon--digei">
          <div class="cm-pinon__rotor" aria-hidden="true">
            <span class="cm-pinon__anillo"></span>
            <!-- Copia de la parte interior del mismo PNG, recentrada sobre los dientes. -->
            <span class="cm-pinon__anillo cm-pinon__anillo--interior"></span>
          </div>
          <a
            class="cm-pinon__medallon cm-pinon__medallon--enlace"
            routerLink="/digei"
            aria-label="Ir al módulo DIGEI"
          >
            <span class="cm-pinon__medallon-img" aria-hidden="true"></span>
          </a>
        </div>

        <div class="cm-pinon cm-pinon--construcciones">
          <div class="cm-pinon__rotor" aria-hidden="true">
            <span class="cm-pinon__anillo"></span>
            <!-- Copia interior del mismo PNG, recentrada sobre los dientes. -->
            <span class="cm-pinon__anillo cm-pinon__anillo--interior"></span>
          </div>
          <span class="cm-pinon__medallon" role="img" aria-label="Construcciones y Mantenimientos">
            <span class="cm-pinon__medallon-img" aria-hidden="true"></span>
          </span>
        </div>
      </div>
    </div>

    <!-- Panal 2-2-2 segun la referencia imagen_objetivo_construcciones_y_mantenimientos_01:
         la fila del medio va corrida medio hexagono a la derecha y la de abajo
         vuelve a quedar alineada con la de arriba. Ocupa la misma caja del panal
         de finca-raiz para que los piñones queden en la misma posición. Las cuatro
         de solicitudes y avales navegan; estadisticas y dashboard se realzan al
         pasar el cursor pero todavia no llevan a ningun sitio. -->
    <div class="cm-panal">
      <article class="cm-ranura cm-ranura--solicitudes-construcciones">
        <a class="cm-ranura__pieza cm-ranura__pieza--enlace"
           routerLink="/digei/construcciones-mantenimientos/solicitudes-construcciones-nuevas/listado-solicitudes-construcciones-nuevas"
           aria-label="Solicitudes de construcción nueva"></a>
      </article>

      <article class="cm-ranura cm-ranura--avales-construcciones">
        <a class="cm-ranura__pieza cm-ranura__pieza--enlace"
           routerLink="/digei/construcciones-mantenimientos/solicitudes-construcciones-nuevas-avaladas/listado-solic-const-nuev-avaladas"
           aria-label="Avales de construcción nueva"></a>
      </article>

      <article class="cm-ranura cm-ranura--solicitudes-mantenimientos">
        <a class="cm-ranura__pieza cm-ranura__pieza--enlace"
           routerLink="/digei/construcciones-mantenimientos/solicitudes-mantenimientos/listado-solicitudes-mantenimientos"
           aria-label="Solicitudes de mantenimiento"></a>
      </article>

      <article class="cm-ranura cm-ranura--avales-mantenimientos">
        <a class="cm-ranura__pieza cm-ranura__pieza--enlace"
           routerLink="/digei/construcciones-mantenimientos/solicitudes-mantenimientos-avalados/listado-solicitudes-mantenimientos-avalados"
           aria-label="Avales de mantenimiento"></a>
      </article>

      <article class="cm-ranura cm-ranura--estadisticas">
        <span class="cm-ranura__pieza" role="img" aria-label="Estadísticas de construcciones y mantenimientos"></span>
      </article>

      <article class="cm-ranura cm-ranura--dashboard">
        <span class="cm-ranura__pieza" role="img" aria-label="Dashboard de construcciones y mantenimientos"></span>
      </article>
    </div>
  </div>
</section>
