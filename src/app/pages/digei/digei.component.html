<section class="digei-futurista" aria-labelledby="titulo-digei">
  <!-- Misma placa que el titulo de Inicio: solo cambian icono y texto.
       El viewBox es mas ancho (480 en vez de 320) porque el texto es mas
       largo; los laterales concavos conservan la misma geometria. -->
  <div class="titulo-seccion">
    <svg class="titulo-seccion__marco" viewBox="0 0 480 70" preserveAspectRatio="none" aria-hidden="true" focusable="false">
      <defs>
        <linearGradient id="titulo-digei-oro" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#fff2a6" />
          <stop offset=".08" stop-color="#f6b900" />
          <stop offset=".2" stop-color="#ffd85a" />
          <stop offset=".46" stop-color="#9a5700" />
          <stop offset=".58" stop-color="#542b00" />
          <stop offset=".76" stop-color="#c98200" />
          <stop offset=".91" stop-color="#fff2a6" />
          <stop offset="1" stop-color="#7a4300" />
        </linearGradient>
        <linearGradient id="titulo-digei-plata" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#ffffff" />
          <stop offset=".3" stop-color="#d8d8d8" />
          <stop offset=".68" stop-color="#a6a6a6" />
          <stop offset="1" stop-color="#5d5d5d" />
        </linearGradient>
      </defs>
      <path class="titulo-seccion__borde" d="M2 2H478V27.07A13 13 0 1 0 478 42.93V68H2V42.93A13 13 0 1 0 2 27.07V2Z" />
      <path class="titulo-seccion__placa" d="M8 8H472V28.29A11 11 0 1 0 472 41.71V62H8V41.71A11 11 0 1 0 8 28.29V8Z" />
      <path class="titulo-seccion__curva-dorada" d="M475 27.68A12 12 0 1 0 475 42.32M5 42.32A12 12 0 1 0 5 27.68" />
      <path class="titulo-seccion__reflejo" d="M18 5H462" />
    </svg>
    <span class="titulo-seccion__icono" aria-hidden="true"></span>
    <h1 id="titulo-digei">Dirección Gestión de Ingenieros</h1>
  </div>

  <div class="digei-escena" aria-label="Procesos de la Dirección Gestión de Ingenieros">
    <div class="digei-engranajes">
      <div class="digei-pinon digei-pinon--central">
        <div class="digei-pinon__rotor" aria-hidden="true">
          <span class="digei-pinon__anillo"></span>
          <!-- Copia de la parte interior del mismo PNG, recentrada sobre los dientes. -->
          <span class="digei-pinon__anillo digei-pinon__anillo--interior"></span>
        </div>
        <span class="digei-pinon__contenido" role="img" aria-label="Proceso DIGEI"></span>
      </div>

      <ul class="digei-areas">
        @for (area of areas; track area.id) {
          <li class="digei-pinon digei-pinon--satelite" [attr.data-posicion]="area.posicion">
            <div class="digei-pinon__rotor" aria-hidden="true">
              <span class="digei-pinon__anillo"></span>
              <!-- Copia interior del mismo PNG, recentrada sobre los dientes. -->
              <span class="digei-pinon__anillo digei-pinon__anillo--interior"></span>
            </div>
            <a class="digei-pinon__enlace" [routerLink]="area.ruta"
               [attr.aria-label]="'Ir a ' + area.nombre">
              <span class="digei-pinon__contenido" aria-hidden="true"></span>
            </a>
          </li>
        }
      </ul>
    </div>
  </div>
</section>
