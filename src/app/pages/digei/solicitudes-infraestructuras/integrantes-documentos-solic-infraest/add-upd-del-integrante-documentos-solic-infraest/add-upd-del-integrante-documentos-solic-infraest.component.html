<div class="modal-formulario" *ngIf="integrantesDocumentosSolicInfraestForm">

  <div class="alerta-eliminar" *ngIf="banderaCrudEliminar">
    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
    Esta acción eliminará el registro de integrantes de la solicitud de infraestructura. ¿Desea continuar?
  </div>

  <form [formGroup]="integrantesDocumentosSolicInfraestForm" (ngSubmit)="guardarModificar()">

    <div class="form-seccion" *ngFor="let rol of roles">
      <div class="seccion-titulo">{{ rol.etiqueta }}</div>
      <div class="form-grid">
        <div class="form-group">
          <label>Grado</label>
          <input type="text" [formControlName]="obtenerNombreControl(rol.clave, 'grado')" placeholder="Ej. CORONEL">
        </div>
        <div class="form-group">
          <label>Nombres</label>
          <input type="text" [formControlName]="obtenerNombreControl(rol.clave, 'nombres')">
        </div>
        <div class="form-group">
          <label>Primer apellido</label>
          <input type="text" [formControlName]="obtenerNombreControl(rol.clave, 'primerApellido')">
        </div>
        <div class="form-group">
          <label>Segundo apellido</label>
          <input type="text" [formControlName]="obtenerNombreControl(rol.clave, 'segundoApellido')">
        </div>
        <div class="form-group">
          <label>Cargo</label>
          <input type="text" [formControlName]="obtenerNombreControl(rol.clave, 'cargo')">
        </div>
        <div class="form-group">
          <label>Archivo foto/firma</label>
          <input type="text" [formControlName]="obtenerNombreControl(rol.clave, 'nombreArchivoFotoFirma')" placeholder="Ej. firma_nombre.png">
        </div>
      </div>
    </div>

    <div class="form-acciones">
      <button type="button" class="btn-sicim btn-secundario" (click)="closeModal()">Cancelar</button>
      <button type="submit" class="btn-sicim btn-primario" *ngIf="banderaCrudGuardar || banderaCrudModificar">
        {{ banderaCrudGuardar ? 'Guardar' : 'Modificar' }}
      </button>
      <button type="button" class="btn-sicim btn-peligro" *ngIf="banderaCrudEliminar" (click)="confirmarEliminar()">Eliminar</button>
    </div>

  </form>
</div>
