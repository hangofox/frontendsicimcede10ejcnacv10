<svg class="menu__defs" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="menu-oro" x1="0" y1="0" x2="0" y2="1">
      <!-- El nudo ocupa del 38% al 62%, y su punto más ancho cae en el 50%.
           Ahí había un #c98200, el tono más apagado de toda la escala, así
           que el nudo entero salía quemado. Esa franja pasa al amarillo
           claro de la barra y el tono apagado se reserva para los bordes
           de arriba y abajo, fuera del nudo. -->
      <stop offset="0" stop-color="#fff2a6" />
      <stop offset=".05" stop-color="#f6b900" />
      <stop offset=".12" stop-color="#fff2a6" />
      <stop offset=".24" stop-color="#ffd85a" />
      <stop offset=".38" stop-color="#f6b900" />
      <stop offset=".50" stop-color="#ffd85a" />
      <stop offset=".62" stop-color="#f6b900" />
      <stop offset=".76" stop-color="#ffd85a" />
      <stop offset=".88" stop-color="#fff2a6" />
      <stop offset=".95" stop-color="#f6b900" />
      <stop offset="1" stop-color="#fff2a6" />
    </linearGradient>
  </defs>
</svg>

<nav class="menu" aria-label="Menú principal">
  <div class="menu__marco">
    <div class="menu__interior">
      @for (opcion of opciones; track opcion.id; let ultimo = $last) {
        @if (opcion.ruta) {
          <a class="opcion" [routerLink]="opcion.ruta" routerLinkActive="activo">
            <span class="icono" [attr.data-icono]="opcion.icono" aria-hidden="true"></span>
            <span class="etiqueta">{{ opcion.etiqueta }}</span>
            @if (!ultimo) {
              <ng-container [ngTemplateOutlet]="separador"></ng-container>
            }
          </a>
        } @else {
          <span class="opcion opcion--inactiva" aria-disabled="true" title="Próximamente">
            <span class="icono" [attr.data-icono]="opcion.icono" aria-hidden="true"></span>
            <span class="etiqueta">{{ opcion.etiqueta }}</span>
            @if (!ultimo) {
              <ng-container [ngTemplateOutlet]="separador"></ng-container>
            }
          </span>
        }
      }
    </div>
  </div>
</nav>

<!-- Una sola pieza dibuja cada unión. El nudo es un arco de circunferencia
     exacto (comando A), no un Bézier ni un semicírculo: R=13 con el centro
     en x=13.3. Corta el borde del módulo en y=25.07 y 40.93, así que deja
     285° de círculo a la vista y el cuello queda a 0.61 del diámetro: es lo
     que hace que se lea como una bola y no como un bulto. El mismo trazado
     se repite en tres trazos para contorno, metal y reflejo. -->
<ng-template #separador>
  <svg class="separador" viewBox="0 0 30 66" preserveAspectRatio="none"
    aria-hidden="true" focusable="false">
    <path class="separador__relleno" d="M0 0 H3 V25.07 A13 13 0 1 1 3 40.93 V66 H0 Z" />
    <path class="separador__sombra" d="M3 4 V25.07 A13 13 0 1 1 3 40.93 V62" />
    <path class="separador__oro" d="M3 0 V25.07 A13 13 0 1 1 3 40.93 V66" />
    <path class="separador__luz" d="M3 0 V25.07 A13 13 0 1 1 3 40.93 V66" />
  </svg>
</ng-template>
