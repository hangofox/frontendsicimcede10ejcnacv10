        </radialGradient>

             un rosa oscuro junto a la barra superior a casi blanco sobre la
             inferior, donde esta el destello. -->

          <stop offset="0%" stop-color="#f20d23" stop-opacity=".14" />

          <stop offset="100%" stop-color="#fddbea" stop-opacity="1" />

             extremos exteriores del adorno. -->
        <linearGradient id="degradado-barra-exterior-izquierda" x1="0" y1="0" x2="71" y2="0" gradientUnits="userSpaceOnUse">

          <stop offset="38%" stop-color="#df929d" />

          <stop offset="100%" stop-color="#f3b6c3" stop-opacity=".58" />
        </linearGradient>

      </defs>

      <!-- Las barras se solapan 2 unidades bajo el primer galon. Ese pequeno
           solapamiento elimina la ranura que produce el antialias del SVG. -->
      <path class="linea-adorno linea-exterior-adorno linea-exterior-izquierda" d="M0 6 H71" />
      <path class="linea-adorno linea-exterior-adorno linea-exterior-derecha" d="M529 6 H600" />

      <!-- galones: 7 de ancho, paso 11.2 y desplazamiento 9 en los 12 de alto
           (inclinacion 0.78). Van antes que las barras para que su halo rojo
           no apague el arranque de estas. -->
      <g class="trazos-oblicuos">
        <polygon points="69,6 76,6 85,18 78,18" />
        <polygon points="80.2,6 87.2,6 96.2,18 89.2,18" />
        <polygon points="91.4,6 98.4,6 107.4,18 100.4,18" />
        <polygon points="102.6,6 109.6,6 118.6,18 111.6,18" />
        <polygon points="113.8,6 120.8,6 129.8,18 122.8,18" />
      </g>

      <!-- espejo exacto de los anteriores: al bajar, su x disminuye -->
      <g class="trazos-oblicuos">
        <polygon points="531,6 524,6 515,18 522,18" />
        <polygon points="519.8,6 512.8,6 503.8,18 510.8,18" />
        <polygon points="508.6,6 501.6,6 492.6,18 499.6,18" />
        <polygon points="497.4,6 490.4,6 481.4,18 488.4,18" />
        <polygon points="486.2,6 479.2,6 470.2,18 477.2,18" />
      </g>

           la base del galon una vez aplicado su translateY(-0.25mm): a esa
           altura empalma con la punta y el trazo se ve continuo. Cierres y
           destellos van en el mismo grupo para que suban solidariamente. -->
      <g class="rectangulo-central">
        <!-- La barra superior tambien entra bajo el ultimo galon en ambos
             extremos para conservar una unica linea visual continua. -->
        <path class="linea-adorno linea-conexion-oblicuos" d="M128 17 H472" />
        <path class="linea-adorno" d="M130 31 H470" />
        <path class="linea-adorno cierre-central" d="M130 17 V31" />
        <path class="linea-adorno cierre-central" d="M470 17 V31" />
        <!-- el destello va sobre la barra inferior, no entre las dos: en la
             referencia el pico de brillo cae en el centro de esa barra -->
        <ellipse class="halo-punto-central" cx="130" cy="31" rx="6" ry="7" />
        <ellipse class="halo-punto-central" cx="470" cy="31" rx="6" ry="7" />
        <circle class="nucleo-punto-central" cx="130" cy="31" r="1.6" />
        <circle class="nucleo-punto-central" cx="470" cy="31" r="1.6" />
      </g>

        <path id="titulo-sistema-outer-profile" d="M6 48.5Q6 45 9 42L27 24Q29 22 33 22H87L96 16H136L143 20H183L190 16H230L239 22H293Q297 22 299 25L317 43Q320 46 320 48.5T317 54L299 72Q297 75 293 75H239L230 81H190L183 77H143L136 81H96L87 75H33Q29 75 27 73L9 55Q6 52 6 48.5Z"/>
        <!-- Perfil del recuadro interior. Las puntas van en angulo vivo, no
             redondeadas, y sus diagonales caen a 45 grados igual que las del
             perfil externo, asi que las dos siluetas quedan paralelas: de la
             punta (15; 48,5) a la esquina (35,5; 28) hay 20,5 en x y 20,5 en y.
             Antes cada punta llevaba tres curvas Q que la redondeaban y rompian
             ese paralelismo contra el filo metalico. -->
        <!-- Superficie oscura del centro. Es el riel rojo desplazado 4 hacia
             afuera por todo su contorno, no una silueta distinta: por eso el
             fondo que rodea al riel es el mismo en cualquier punto del recorrido
             y no aparece la cuna triangular que dejaba el escalon central.
             El desplazamiento de un vertice a 45 grados no es 4 sino 4 en cada
             una de las dos rectas, asi que la punta pasa de x=15 a x=11 y la
             esquina de (35,5; 28) a (35,5; 24).
             Medido en titulo_sistema_futurista_05.png: encima del riel siempre
             hay oscuro (en x=70 y x=85 de y=24 a y=28, en x=100 y x=110 de y=22
             a y=27) y la chapa gris queda mas arriba, en una franja delgada. -->
        <path id="titulo-sistema-inner-profile" d="M11 48.5L35.5 24H290.5L315 48.5L290.5 73H35.5Z"/>
        <!-- El riel rojo interior no comparte silueta con la superficie oscura.
             En titulo_sistema_futurista_05.png la superficie sube en el centro
             (a x=130 lo oscuro arranca en y=21) pero la linea roja corre recta
             a la misma altura de punta a punta (y=28 a 30 tanto en x=60 como en
             x=130). Por eso el riel usa este perfil sin el escalon central. -->
        <path id="titulo-sistema-inner-rail-profile" d="M15 48.5L35.5 28H290.5L311 48.5L290.5 69H35.5Z"/>
        <!-- Trapecio isosceles que flanquea el haz central. Ocupa la MISMA
             franja que las pestanas metalicas grises vecinas (de y=14 a y=21),
             de modo que su base queda al ras de la base de esas barras y la
             linea roja de y=22 pasa por debajo de las dos piezas.
             Base mayor arriba de x=115,26 a x=152,35 y base menor abajo de
             x=122,26 a x=145,35 (se ensancho 4 hacia la pestana para cubrir el
             hueco de las dos franjas suprimidas y despues se recorto dos veces
             1,13 por ese mismo lado, 0,3 mm cada vez): los dos lados miden 7 en horizontal por 7 en vertical, asi
             que la pieza es isosceles por construccion.
             El ancho no es libre: a la altura de la base mayor el vecino de
             afuera (la base oscura de la pestana) termina en x=115,78 y el de
             adentro (el trazo de 2,4 del triangulo central) arranca en x=149,43.
             La pieza se ensancha 4,15 hacia el triangulo (0,3 mm mas 0,4 mm mas
             0,4 mm: el panel mide 326 px para 326 unidades del viewBox, asi que
             1 mm son 3,78 unidades). A partir de este ultimo paso el trapecio
             deja de estar separado del triangulo: lo pisa 0,40 en la esquina,
             entre y=14,95 y y=15,21, porque el borde del triangulo se va hacia

             (y=14,25 a 17,75) y la chapa gris de debajo. Su borde izquierdo va
             exactamente sobre el canto inclinado de la placa y el derecho sobre
             el lado del trapecio, asi que tapa el hueco
             sin morder ninguna de las dos piezas. Cubre el hueco completo, de
             y=14 a y=24,6, con el negro exacto del fondo del cabezote (#020203)

             piezas y no como una cuna gris. Con el degradado anterior se notaba
             como pieza propia; recortandolo para dejar ver la banda roja, lo que
             asomaba era el rojo. Su borde izquierdo se
             recalcula cada vez que se mueven las placas: va de (106,0266; 14) a
             (116,6266; 24,6), solapando ligeramente el canto derecho de la placa
             actual. Si se queda con el valor viejo, asoma por la izquierda del
             trapecio y se lee como una punta oscura pegada a la placa. Con el borde anterior, calculado para la placa sin
