        <stop offset="20%" stop-color="#fddbea" stop-opacity=".90" />

  <div class="adorno-superior" aria-hidden="true">
    <svg viewBox="0 0 600 40" preserveAspectRatio="none">
      <defs>
        <radialGradient id="degradado-punto-barra-central">
          <stop offset="0%" stop-color="#fddbea" stop-opacity=".6" />
          <stop offset="18%" stop-color="#fab2c2" stop-opacity=".52" />
          <stop offset="36%" stop-color="#f7697f" stop-opacity=".44" />
          <stop offset="54%" stop-color="#f20d23" stop-opacity=".34" />
          <stop offset="70%" stop-color="#f20d23" stop-opacity=".22" />
          <stop offset="84%" stop-color="#f20d23" stop-opacity=".09" />
          <stop offset="100%" stop-color="#f20d23" stop-opacity="0" />
        </radialGradient>

        <!-- El cierre vertical se apaga hacia arriba: en la referencia pasa de
             un rosa oscuro junto a la barra superior a casi blanco sobre la
             inferior, donde esta el destello. -->
        <linearGradient id="degradado-cierre-central" x1="0" y1="17" x2="0" y2="31" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#f20d23" stop-opacity=".14" />
          <stop offset="30%" stop-color="#f20d23" stop-opacity=".24" />
          <stop offset="60%" stop-color="#f20d23" stop-opacity=".42" />
          <stop offset="82%" stop-color="#f7697f" stop-opacity=".72" />
          <stop offset="100%" stop-color="#fddbea" stop-opacity="1" />
        </linearGradient>

        <!-- Empalme cromatico con la barra principal del marco en los dos
             extremos exteriores del adorno. -->
        <linearGradient id="degradado-barra-exterior-izquierda" x1="0" y1="0" x2="71" y2="0" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#d37a7c" />
          <stop offset="38%" stop-color="#df929d" />
          <stop offset="72%" stop-color="#edabb9" />
          <stop offset="100%" stop-color="#f3b6c3" />
        </linearGradient>
        <linearGradient id="degradado-barra-exterior-derecha" x1="600" y1="0" x2="529" y2="0" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#d37a7c" />
          <stop offset="38%" stop-color="#df929d" />
          <stop offset="72%" stop-color="#edabb9" />
          <stop offset="100%" stop-color="#f3b6c3" />
        </linearGradient>

      </defs>

      <!-- Las barras se solapan 2 unidades bajo el primer galon. Ese pequeno
           solapamiento elimina la ranura que produce el antialias del SVG. -->
      <path class="linea-adorno linea-exterior-adorno linea-exterior-izquierda" d="M0 6 H71" />
      <path class="linea-adorno linea-exterior-adorno linea-exterior-derecha" d="M529 6 H600" />

      <!-- galones: 7 de ancho, paso 11.2 y desplazamiento 9 en los 12 de alto
           (inclinacion 0.78). Van antes que las barras para que su halo rojo
           no apague el arranque de estas. -->
      <g class="trazos-oblicuos">
        <polygon points="69,6 76,6 85,18 78,18" />
        <polygon points="80.2,6 87.2,6 96.2,18 89.2,18" />
        <polygon points="91.4,6 98.4,6 107.4,18 100.4,18" />
        <polygon points="102.6,6 109.6,6 118.6,18 111.6,18" />
        <polygon points="113.8,6 120.8,6 129.8,18 122.8,18" />
      </g>

      <!-- espejo exacto de los anteriores: al bajar, su x disminuye -->
      <g class="trazos-oblicuos">
        <polygon points="531,6 524,6 515,18 522,18" />
        <polygon points="519.8,6 512.8,6 503.8,18 510.8,18" />
        <polygon points="508.6,6 501.6,6 492.6,18 499.6,18" />
        <polygon points="497.4,6 490.4,6 481.4,18 488.4,18" />
        <polygon points="486.2,6 479.2,6 470.2,18 477.2,18" />
      </g>

      <!-- Rectangulo central. La barra superior va a y=17, que es donde queda
           la base del galon una vez aplicado su translateY(-0.25mm): a esa
           altura empalma con la punta y el trazo se ve continuo. Cierres y
           destellos van en el mismo grupo para que suban solidariamente. -->
      <g class="rectangulo-central">
        <!-- La barra superior tambien entra bajo el ultimo galon en ambos
             extremos para conservar una unica linea visual continua. -->
        <path class="linea-adorno linea-conexion-oblicuos" d="M128 17 H472" />
        <path class="linea-adorno" d="M130 31 H470" />
        <path class="linea-adorno cierre-central" d="M130 17 V31" />
        <path class="linea-adorno cierre-central" d="M470 17 V31" />
        <!-- el destello va sobre la barra inferior, no entre las dos: en la
             referencia el pico de brillo cae en el centro de esa barra -->
        <ellipse class="halo-punto-central" cx="130" cy="31" rx="6" ry="7" />
        <ellipse class="halo-punto-central" cx="470" cy="31" rx="6" ry="7" />
        <circle class="nucleo-punto-central" cx="130" cy="31" r="1.6" />
        <circle class="nucleo-punto-central" cx="470" cy="31" r="1.6" />
      </g>
    </svg>
  </div>

  <div class="informacion-cabezote">

    @if (mostrarUsuario) {
      <app-datos-usuario-conectado></app-datos-usuario-conectado>

  <!-- Panel del titulo del sistema. Toda la pieza es un SVG multicapa trazado sobre
       el lienzo 326 x 97 medido en la referencia: forma visible de 314 x 69
       (razon 4,55) centrada en x=163 / y=48,5, con margen transparente arriba
       y abajo para que los resplandores no se recorten.
       El <h1> visible para lectores de pantalla queda fuera del SVG; todos los
       grupos graficos son decorativos. -->
  <div class="marca">
    <h1 class="sr-only">{{ tituloSistema }}</h1>

          <stop offset=".88" stop-color="#bd0028"/><stop offset="1" stop-color="#ff496c"/>
        </linearGradient>
        <!-- Cuerpo de los trapecios que flanquean el haz central. El sombreado
             va en la base mayor, que es la que da al fondo negro de afuera, y

             interior del panel y por donde pasa el brillo. Medido sobre

        <linearGradient id="titulo-sistema-trapecio-cuerpo" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#26000a"/><stop offset=".38" stop-color="#5e0014"/>

        </linearGradient>
        <linearGradient id="titulo-sistema-tab-metal" x1="0" y1="0" x2="1" y2="1">

          <stop offset=".55" stop-color="#aeb1b7"/><stop offset=".72" stop-color="#34363c"/>

          <stop offset=".12" stop-color="#ff3158" stop-opacity=".84"/>
          <stop offset=".44" stop-color="#c80d30" stop-opacity=".42"/>
          <stop offset="1" stop-color="#590712" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="titulo-sistema-triangular-light-bottom" cx="50%" cy="100%" r="75%">
          <stop offset="0" stop-color="#fff5f7" stop-opacity="1"/>
          <stop offset=".12" stop-color="#ff3158" stop-opacity=".92"/>
          <stop offset=".44" stop-color="#c80d30" stop-opacity=".48"/>
          <stop offset="1" stop-color="#590712" stop-opacity="0"/>

          <stop offset=".24" stop-color="#2a2c32"/><stop offset=".36" stop-color="#39050d"/>
          <stop offset=".47" stop-color="#a70b27"/><stop offset=".55" stop-color="#ff1748"/>
          <stop offset=".66" stop-color="#940a22"/><stop offset=".78" stop-color="#31040b"/>
          <stop offset=".9" stop-color="#5b5e65"/><stop offset="1" stop-color="#9b9fa6"/>
        </linearGradient>
        <linearGradient id="titulo-sistema-tip-rail-metal" x1="8" y1="0" x2="96" y2="0" gradientUnits="userSpaceOnUse">

          <stop offset=".14" stop-color="#858990"/>
          <stop offset=".3" stop-color="#5b5e65"/>
          <stop offset=".46" stop-color="#3b3e45"/>
          <stop offset=".58" stop-color="#292c32"/>
          <stop offset=".72" stop-color="#41444b"/>
          <stop offset=".88" stop-color="#74787f"/>
          <stop offset="1" stop-color="#aeb1b7"/>
        </linearGradient>
        <linearGradient id="titulo-sistema-rail-highlight" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#fff8fa" stop-opacity="0"/><stop offset=".48" stop-color="#fff8fa" stop-opacity=".78"/>
          <stop offset=".55" stop-color="#ffb7c4" stop-opacity=".52"/><stop offset="1" stop-color="#ffb7c4" stop-opacity="0"/>
        </linearGradient>
        <linearGradient id="titulo-sistema-horizontal-fade" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#b5092a" stop-opacity="0"/><stop offset=".22" stop-color="#b5092a" stop-opacity=".04"/>
          <stop offset=".34" stop-color="#c80d30" stop-opacity=".12"/><stop offset=".43" stop-color="#ff1748" stop-opacity=".35"/>
          <stop offset=".48" stop-color="#ff6b87" stop-opacity=".7"/><stop offset=".5" stop-color="#ffb7c4"/>
          <stop offset=".52" stop-color="#ff6b87" stop-opacity=".7"/><stop offset=".57" stop-color="#ff1748" stop-opacity=".35"/>
          <stop offset=".66" stop-color="#c80d30" stop-opacity=".12"/><stop offset=".78" stop-color="#b5092a" stop-opacity=".04"/>
          <stop offset="1" stop-color="#b5092a" stop-opacity="0"/>
        </linearGradient>
        <radialGradient id="titulo-sistema-vertical-fall">

          <stop offset=".42" stop-color="#ff1748" stop-opacity=".28"/><stop offset=".72" stop-color="#790018" stop-opacity=".08"/>
          <stop offset="1" stop-color="#590712" stop-opacity="0"/>

          <stop offset=".48" stop-color="#ff496c" stop-opacity=".52"/><stop offset="1" stop-color="#bd0028" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="titulo-sistema-degradado-nucleo-oblicuo" cx="50%" cy="50%" r="60%">
          <stop offset="0" stop-color="#ffffff" stop-opacity=".76"/>
          <stop offset=".08" stop-color="#fff8fa" stop-opacity=".68"/>
          <stop offset=".24" stop-color="#fff0f4" stop-opacity=".48"/>
          <stop offset=".46" stop-color="#ff9aaf" stop-opacity=".27"/>
          <stop offset=".72" stop-color="#ff3158" stop-opacity=".09"/>
          <stop offset="1" stop-color="#bd0028" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="titulo-sistema-degradado-halo-oblicuo" cx="50%" cy="50%" r="58%">

          <stop offset=".18" stop-color="#e90e3b" stop-opacity=".76"/>
          <stop offset=".42" stop-color="#bd0028" stop-opacity=".42"/>
          <stop offset=".68" stop-color="#790018" stop-opacity=".14"/>
          <stop offset=".86" stop-color="#4a000e" stop-opacity=".035"/>
          <stop offset="1" stop-color="#250007" stop-opacity="0"/>

        <filter id="titulo-sistema-soft-glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="2.2"/></filter>

          <feGaussianBlur stdDeviation="1.15" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <filter id="titulo-sistema-central-bloom" x="-120%" y="-180%" width="340%" height="460%"><feGaussianBlur stdDeviation="6.4"/></filter>
        <filter id="titulo-sistema-horizontal-flare" x="-120%" y="-300%" width="340%" height="700%"><feGaussianBlur stdDeviation="2.8"/></filter>
        <filter id="titulo-sistema-vertical-diffuse" x="-180%" y="-100%" width="460%" height="300%"><feGaussianBlur stdDeviation="3.2 4.4"/></filter>

          <ellipse cx="0" cy="0" rx="14.5" ry="7.8" fill="url(#titulo-sistema-degradado-halo-oblicuo)" opacity=".7" filter="url(#titulo-sistema-horizontal-flare)"/>

          <ellipse cx="0" cy="0" rx="6.8" ry="3.8" fill="url(#titulo-sistema-degradado-nucleo-oblicuo)" opacity=".78" filter="url(#titulo-sistema-central-core-glow)"/>

        <path id="titulo-sistema-outer-profile" d="M6 48.5Q6 45 9 42L27 24Q29 22 33 22H87L96 16H136L143 20H183L190 16H230L239 22H293Q297 22 299 25L317 43Q320 46 320 48.5T317 54L299 72Q297 75 293 75H239L230 81H190L183 77H143L136 81H96L87 75H33Q29 75 27 73L9 55Q6 52 6 48.5Z"/>
        <!-- Perfil del recuadro interior. Las puntas van en angulo vivo, no
             redondeadas, y sus diagonales caen a 45 grados igual que las del
             perfil externo, asi que las dos siluetas quedan paralelas: de la
             punta (15; 48,5) a la esquina (35,5; 28) hay 20,5 en x y 20,5 en y.
             Antes cada punta llevaba tres curvas Q que la redondeaban y rompian
             ese paralelismo contra el filo metalico. -->
        <!-- Superficie oscura del centro. Es el riel rojo desplazado 4 hacia
             afuera por todo su contorno, no una silueta distinta: por eso el
             fondo que rodea al riel es el mismo en cualquier punto del recorrido
             y no aparece la cuna triangular que dejaba el escalon central.
             El desplazamiento de un vertice a 45 grados no es 4 sino 4 en cada
             una de las dos rectas, asi que la punta pasa de x=15 a x=11 y la
             esquina de (35,5; 28) a (35,5; 24).
             Medido en titulo_sistema_futurista_05.png: encima del riel siempre
             hay oscuro (en x=70 y x=85 de y=24 a y=28, en x=100 y x=110 de y=22
             a y=27) y la chapa gris queda mas arriba, en una franja delgada. -->
        <path id="titulo-sistema-inner-profile" d="M11 48.5L35.5 24H290.5L315 48.5L290.5 73H35.5Z"/>
        <!-- El riel rojo interior no comparte silueta con la superficie oscura.
             En titulo_sistema_futurista_05.png la superficie sube en el centro
             (a x=130 lo oscuro arranca en y=21) pero la linea roja corre recta
             a la misma altura de punta a punta (y=28 a 30 tanto en x=60 como en
             x=130). Por eso el riel usa este perfil sin el escalon central. -->
        <path id="titulo-sistema-inner-rail-profile" d="M15 48.5L35.5 28H290.5L311 48.5L290.5 69H35.5Z"/>
        <!-- Trapecio isosceles que flanquea el haz central. Ocupa la MISMA
             franja que las pestanas metalicas grises vecinas (de y=14 a y=21),
             de modo que su base queda al ras de la base de esas barras y la
             linea roja de y=22 pasa por debajo de las dos piezas.
             Base mayor arriba de x=117 a x=152,35 y base menor abajo de x=124 a
             x=145,35: los dos lados miden 7 en horizontal por 7 en vertical, asi
             que la pieza es isosceles por construccion.
             El ancho no es libre: a la altura de la base mayor el vecino de
             afuera (la base oscura de la pestana) termina en x=115,78 y el de
             adentro (el trazo de 2,4 del triangulo central) arranca en x=149,43.

      <g id="titulo-sistema-trapecios-centrales" aria-hidden="true">
