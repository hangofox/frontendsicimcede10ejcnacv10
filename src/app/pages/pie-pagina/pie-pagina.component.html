<footer class="pie">
  <!-- Cada escudo va envuelto en un span: el ::after de ese contenedor dibuja
       el brillo que lo recorre, enmascarado con el alfa del propio PNG para
       que la luz siga la silueta del escudo y no un rectangulo. -->
  <div class="iconos" aria-label="Escudos institucionales">
    <span class="escudo escudo-ejercito">
      <img src="assets/images/imagen_footer_escudo_ejercito_nacional_01.png" alt="Escudo del Ejército Nacional">
    </span>
    <span class="escudo escudo-caocc">
      <img src="assets/images/imagen_footer_escudo_caocc_01.png" alt="Escudo del CAOCC">
    </span>
    <span class="escudo escudo-baicc">
      <img src="assets/images/imagen_footer_escudo_baicc_01.png" alt="Escudo del BAICC">
    </span>
    <span class="escudo escudo-jempp">
      <img src="assets/images/imagen_footer_escudo_jempp_cede10_01.png" alt="Escudo JEMPP CEDE 10">
    </span>
  </div>

  <svg
    class="legal-circular"
    viewBox="0 0 736 339.5"
    preserveAspectRatio="xMidYMid meet"
    role="img"
    aria-label="Todos los derechos reservados, Ejército Nacional, CAOCC, versión 1.0.0.0."
  >
    <defs>
      <path id="arco-legal-pie" d="M -182 223 Q 356 433 894 223"></path>
    </defs>
    <text>
      <textPath href="#arco-legal-pie" startOffset="50%" text-anchor="middle" textLength="650" lengthAdjust="spacing">
        Todos los derechos reservados  |  Ejército Nacional  |  CAOCC  |  V1.0.0.0.
      </textPath>
    </text>
  </svg>
</footer>
