<!-- Aquí irán los rombos de mantenimiento e historial sobre su fondo, como en Mantenimientos de Infraestructuras. Mientras se
     crean, va el título en texto simple. Para regresar a Equipos de Ingenieros está la ruta de navegación superior (>>). -->
<div class="me-escena" aria-label="Mantenimientos de equipos de ingenieros">
  <h1 class="me-escena__titulo">Mantenimientos de Equipos de Ingenieros</h1>
</div>

<section class="page-card mantenimientos-equip-ing-opciones" aria-label="Opciones de mantenimientos de equipos de ingenieros">
  <ul>
    @for (opcion of opciones; track opcion.titulo) {
      <li>
        @if (opcion.ruta) {
          <a [routerLink]="opcion.ruta">{{ opcion.titulo }}</a>
        } @else {
          <!-- Aún sin componente: se enlazará cuando exista. -->
          <a role="link" aria-disabled="true">{{ opcion.titulo }}</a>
        }
      </li>
    }
  </ul>
</section>
