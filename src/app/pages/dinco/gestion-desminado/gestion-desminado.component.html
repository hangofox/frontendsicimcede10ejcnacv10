<!-- Aquí irán el piñón de DINCO (regresa a DINCO) y el piñón de Gestión de Desminado, como en las áreas de DIGEI.
     Mientras se crean, van en texto simple en la misma posición. -->
<div class="gd-escena" aria-label="Gestión de Desminado">
  <a class="gd-escena__dinco" routerLink="/dinco" aria-label="Ir a DINCO">DINCO</a>
  <h1 class="gd-escena__titulo">Gestión de Desminado</h1>
</div>

<section class="page-card gestion-desminado-opciones" aria-label="Opciones de Gestión de Desminado">
  <ul>
    @for (opcion of opciones; track opcion.titulo) {
      <li>
        @if (opcion.ruta) {
          <a [routerLink]="opcion.ruta">{{ opcion.titulo }}</a>
        } @else {
          <!-- Aún sin componente: se enlazará cuando exista. -->
          <a role="link" aria-disabled="true">{{ opcion.titulo }}</a>
        }
      </li>
    }
  </ul>
</section>
