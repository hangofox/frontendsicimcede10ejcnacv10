<div *ngIf="visible">
    <p-toast [style]="{marginTop: '80px'}" position="top-right"></p-toast>
</div>
<!--<p-toast position="top-left" key="tl"></p-toast>-->
<!--<p-toast position="top-center" key="tc"></p-toast>-->
<!--<p-toast position="bottom-center" key="bc"></p-toast>-->

<p-toast position="top-center" key="c" (onClose)="no_confirmacion()" [baseZIndex]="5000">
    <ng-template let-message pTemplate="message">
        <div class="p-flex p-flex-column" style="flex: 1">
            <div class="p-text-center" style="text-align: center">
                <i class="pi pi-exclamation-triangle" style="font-size: 3rem"></i>
                <h4>{{message.summary}}</h4>
                <p>{{message.detail}}</p>
            </div>
            <div class="p-grid p-fluid">
                <table [border]="0">
                    <tr>
                      <td>
                        <div class="p-col-6">
                           <button type="button" pButton (click)="si_confirmacion()" label="Si" class="p-button-success" style="width: 10px"></button>
                        </div>
                      </td>
                      <td>
                        <div class="p-col-6">
                           <button type="button" pButton (click)="no_confirmacion()" label="No" class="p-button-secondary" style="width: 10px"></button>
                        </div>
                      </td>
                    </tr>
                </table>
            </div>
        </div>
    </ng-template>
</p-toast>
